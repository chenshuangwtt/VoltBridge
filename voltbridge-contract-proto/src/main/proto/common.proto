syntax = "proto3";

package voltbridge.contract.v1;

option java_multiple_files = true;
option java_package = "com.voltbridge.contract.v1";

message ConnectorRef {
  string connector_id = 1;
  int32 connector_no = 2;
}

message FailureDetail {
  string code = 1;
  string reason = 2;
}

message ProtocolRef {
  string family = 1;
  string version = 2;
}

message MessageMetadata {
  string message_id = 1;
  string tenant_id = 2;
  int64 occurred_at_epoch_millis = 3;
  string trace_id = 4;
  uint32 schema_version = 5;
}

message GatewayRoute {
  string gateway_node_id = 1;
  string session_id = 2;
  uint64 connection_epoch = 3;
  ProtocolRef protocol = 4;
}
